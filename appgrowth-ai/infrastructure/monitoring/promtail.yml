server: { http_listen_port: 9080, grpc_listen_port: 0 }
positions: { filename: /tmp/positions.yaml }
clients: [{ url: http://appgrowth-loki:3100/loki/api/v1/push }]
scrape_configs:
  - job_name: appgrowth
    docker_sd_configs: [{ host: unix:///var/run/docker.sock, refresh_interval: 30s, filters: [{ name: name, values: ["appgrowth-*"] }] }]
    relabel_configs:
      - { source_labels: ['__meta_docker_container_name'], regex: '/(.*)', target_label: container }
    pipeline_stages:
      # Defence in depth: scrub anything token-like that a library might print.
      - replace: { expression: '(?i)(bearer\s+|access_token=|refresh_token=|api[_-]?key=)[A-Za-z0-9._\-]+', replace: '$1[redacted]' }
