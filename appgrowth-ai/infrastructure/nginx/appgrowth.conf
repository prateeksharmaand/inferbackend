# Standalone deployments (compose profile "nginx"). First issue the certificate with scripts/deploy.sh --init-certs.
server {
    listen 80;
    server_name marketing.noushealthcare.online;
    location /.well-known/acme-challenge/ { root /var/www/acme; }
    location / { return 301 https://$host$request_uri; }
}
server {
    listen 443 ssl;
    http2 on;
    server_name marketing.noushealthcare.online;
    ssl_certificate     /etc/letsencrypt/live/marketing.noushealthcare.online/fullchain.pem;
    ssl_certificate_key /etc/letsencrypt/live/marketing.noushealthcare.online/privkey.pem;
    ssl_protocols TLSv1.2 TLSv1.3;
    ssl_session_cache shared:SSL:10m;
    add_header Strict-Transport-Security "max-age=31536000; includeSubDomains" always;
    add_header X-Content-Type-Options nosniff always;
    add_header Referrer-Policy strict-origin-when-cross-origin always;
    server_tokens off;
    client_max_body_size 110m;
    proxy_http_version 1.1;
    proxy_set_header Host $host;
    proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
    proxy_set_header X-Forwarded-Proto $scheme;
    proxy_set_header Upgrade $http_upgrade;
    proxy_set_header Connection "upgrade";
    proxy_read_timeout 120s;
    location = /api/v1/metrics { return 404; }
    location /api/ { proxy_pass http://appgrowth-api:4100; }
    location /grafana/ { proxy_pass http://appgrowth-grafana:3000; }
    location / { proxy_pass http://appgrowth-web:3000; }
}
