[project]
name = "careerpilot-backend"
version = "0.1.0"
requires-python = ">=3.12"
dependencies = [
  "fastapi>=0.115",
  "uvicorn[standard]>=0.32",
  "sqlalchemy>=2.0.36",
  "psycopg[binary]>=3.2",
  "alembic>=1.14",
  "pydantic>=2.9",
  "pydantic-settings>=2.6",
  "email-validator>=2.2",
  "argon2-cffi>=23.1",
  "pyjwt>=2.10",
  "python-multipart>=0.0.17",
  "pymupdf>=1.25",
  "python-docx>=1.1",
  "anthropic>=0.75",
  "celery[redis]>=5.4",
  "redis>=5.2",
  "httpx>=0.28",
  "beautifulsoup4>=4.12",
  "cryptography>=44",
]

[dependency-groups]
dev = ["pytest>=8.3", "pytest-cov>=6.0"]

[tool.pytest.ini_options]
testpaths = ["tests"]
addopts = "-q"
